ny\":\"Cinématique.co\",\"company_link\":\"https://cinematique.co/\",\"country\":\"Remote\",\"description\":\"Built and owns serverless GPU inference fleet on RunPod for ComfyUI video/image pipelines — models: Wan2.2-Animate 14B, ViTPose, YOLOv10, SeC-4B. Engineered base Docker images w/ standardized CUDA setup inherited across all worker images — one change propagates fleet-wide. Eliminated cold-start model pulls by automating HuggingFace + CivitAI downloads into pre-loaded RunPod network volumes at provisioning time. Validated end-to-end inference: pose estimation, video segmentation, VAE decode, multi-LoRA video gen.\",\"period\":\"Oct 2025 – Feb 2026\",\"role\":\"Generative AI Platform Engineer (Freelance)\"},{\"company\":\"Soltic Algeria\",\"company_link\":\"\",\"country\":\"Algiers, DZ\",\"description\":\"Ran the full client lifecycle: discovery, solution design, demos, deployment, and post-go-live support. Deployed firewalls, email security gateways, and endpoint protection for enterprise clients. Trained client teams on product config, policy management, and incident response. Primary technical contact after deployment — support, advisory, and escalations.\",\"period\":\"Apr – Aug 2025\",\"role\":\"Cybersecurity Solutions Engineer (mission)\"},{\"company\":\"InfraXcode\",\"company_link\":\"https://infraxcode.com/\",\"country\":\"Paris, FR (Remote)\",\"description\":\"R\\u0026D engineer on a virtual network lab product — teams spin up stateful emulated devices and run real Ansible playbooks and Terraform providers against them unmodified; built SSH + RESTCONF servers from scratch to handle the protocol layer. Agent grounds every response via hybrid RAG + BM25 over vendor CLI docs and YANG models; real NetOps team ran production scripts against it blind — ~80% output match vs physical hardware. Solved context overflow with a summarization node preserving live device state; evaluated local storage vs Neo4j for session persistence; identified token streaming latency as fundamental constraint — documented and accepted as architectural tradeoff. Shipped test orchestration: engineer declares script + failure states (closed port, bad creds, missing config) → orchestrator spawns emulated device per scenario → returns side-by-side diffs before prod. Migrated inference mid-project from OpenAI/Groq → self-hosted Llama (HuggingFace + Ollama) — cut API dependency and reduced latency.\",\"period\":\"Feb 2024 – Apr 2025\",\"role\":\"Software Engineer – AI, Automation \\u0026 R\\u0026D\"},{\"company\":\"InfraXcode\",\"company_link\":\"https://infraxcode.com/\",\"country\":\"Paris, FR (Remote)\",\"description\":\"Automated network inventory collection and NetBox sync across Cisco IOS/IOS-XE/NXOS, ACI, Palo Alto via SSH/REST/TextFSM — Total cut manual effort. IaC (Terraform) + config mgmt (Ansible/AWX) across AWS, Azure, GCP. CI/CD via GitHub Actions + GitLab.\",\"period\":\"Sep 2023 – Apr 2025\",\"role\":\"NetDevOps Engineer\"}],\"posts\":[{\"body\":\"The DLP problem nobody talks about Most organizations have some form of data loss prevention. A credit card number in an email gets flagged. An SSN in a database field triggers an alert. These work because the data is structured — there\\u0026rsquo;s a known format, a known location, and often a checksum you can validate against.\\nThe Luhn algorithm catches 4111 1111 1111 1111. A regex like \\\\d{3}-\\\\d{2}-\\\\d{4} catches US Social Security Numbers in clean text. A network DLP appliance doing deep packet inspection will intercept these on the wire before they leave the perimeter.\\nThen someone pastes a clinical note into a ticketing system:\\n\\u0026ldquo;Patient Jordan Wells, DOB 04/14/1979, was admitted for follow-up on record #MR-88421. Contact via (202) 555-0193 or j.wells@outlook.com. Insurance: Anthem BCBS, member 901-224-3311.\\u0026rdquo;\\nNo field labels. No consistent formatting. Multiple entity types interleaved with prose. A regex scanner will catch the phone number and email if the patterns match, miss the medical record number (non-standard prefix), and have no idea that \\u0026ldquo;Jordan Wells\\u0026rdquo; is a name rather than a company, a street, or a product.\\nThis is the gap traditional DLP was never designed to close.\\nWhy rule-based systems fail at scale Context blindness \\u0026quot;Call extension 4567\\u0026quot; and \\u0026quot;(555) 123-4567\\u0026quot; both match a loose phone regex. Only context — the surrounding sentence structure, the presence of an area code, the word \\u0026ldquo;extension\\u0026rdquo; — tells them apart. Regex has no context model.\\nThe same problem applies to names. \\u0026ldquo;Wells\\u0026rdquo; is a surname, a city in Somerset, a financial institution, and a plural noun. Without understanding the sentence, a keyword list either flags everything or nothing.\\nThe international format problem US SSN: \\\\d{3}-\\\\d{2}-\\\\d{4}. French NIR: [12]\\\\d{2}(0[1-9]|1[0-2]|20)\\\\d{2}[0-9AB]\\\\d{3}\\\\d{2}. German Steueridentifikationsnummer: eleven digits with a specific check algorithm. UK National Insurance: [A-CEGHJ-PR-TW-Z]{2}\\\\d{6}[A-D]. Each jurisdiction, each document type, each vendor data format adds a new pattern to maintain. At enterprise scale this becomes hundreds of regex rules in a config file that someone updates manually after incidents.\\nThe false positive problem High recall (catch everything) means high false positives. Security teams learn to ignore alerts. Low false positives mean tuning the rules until they miss real incidents. There is no threshold where a regex rule is both precise and complete for unstructured text — the problem isn\\u0026rsquo;t the threshold, it\\u0026rsquo;s that the underlying approach doesn\\u0026rsquo;t model language.\\nWhat network DLP misses DLP at the wire catches exfiltration in transit. It does nothing about data already in a document repository, a support ticket, an LLM training corpus, or a code review comment. The majority of PII exposure incidents involve data at rest or data in use, not data in motion.\\nWhy LLMs are not the answer either GPT-4 with a prompt can extract PII from a document. In practice:\\nNon-determinism: run the same text twice and get different entity offsets. Unacceptable for audit logging. Cost at scan volume: a SIEM ingesting millions of log lines per day cannot send each one to an LLM API at $0.01/1k tokens. Data leaves your perimeter: calling an external API with the exact data you\\u0026rsquo;re trying to protect is a contradiction in a HIPAA or GDPR context. Latency: a generative model processes tokens sequentially. A 512-token document takes hundreds of milliseconds. Inline scanning at ingestion speed is not viable. No structured output guarantee: the model may return entities as prose, as JSON, or hallucinate entities that aren\\u0026rsquo;t in the text. The right tool is something that behaves more like a classifier than a generator — fast, deterministic, structured output, no data sent to an external service if run locally.\\nGLiNER: the architecture GLiNER (Generalist Model for Named Entity Recognition using Bidirectional Transformer) was published in arxiv:2311.08526 by researchers from Paris-Nord University. The core idea: decouple the entity type set from the model weights.\\nTraditional NER models like spaCy\\u0026rsquo;s en_core_web_trf have a fixed output layer — one neuron per entity class, trained and frozen. To add a new class you retrain. GLiNER\\u0026rsquo;s output is a score for each (span, label) pair, where both the span and the label are encoded by the same transformer.\\nHow scoring works The model encodes the full input text with a bidirectional transformer encoder (BERT-style, not causal). This produces a contextual embedding for every token — \\u0026ldquo;Wells\\u0026rdquo; in \\u0026quot;patient Jordan Wells\\u0026quot; gets a different embedding than \\u0026ldquo;Wells\\u0026rdquo; in \\u0026quot;Wells Fargo account\\u0026quot;.\\nThe label strings (\\u0026quot;name\\u0026quot;, \\u0026quot;account_number\\u0026quot;, \\u0026quot;swift_bic\\u0026quot;) are also passed through the same encoder as short sequences.\\nFor each candidate text span and each label, the model computes a dot-product similarity score between the span\\u0026rsquo;s pooled representation and the label\\u0026rsquo;s representation. Spans where the score exceeds threshold are returned as entities.\\nInput: \\u0026#34;His account 90012234 (Swift: WFBIUS6S) was flagged at 09:42 AM.\\u0026#34; Labels: [\\u0026#34;account_number\\u0026#34;, \\u0026#34;swift_bic\\u0026#34;, \\u0026#34;time\\u0026#34;] → span \\u0026#34;90012234\\u0026#34; × \\u0026#34;account_number\\u0026#34; → score 0.94 ✓ → span \\u0026#34;WFBIUS6S\\u0026#34; × \\u0026#34;swift_bic\\u0026#34; → score 0.97 ✓ → span \\u0026#34;09:42 AM\\u0026#34; × \\u0026#34;time\\u0026#34; → score 0.91 ✓ No text is generated. The output is purely a list of {start, end, text, label, score} tuples. This makes it deterministic, auditable, and fast.\\nOpen-vocabulary NER Because the label is encoded as text at inference time, you can ask the model to find any entity type without retraining. Pass \\u0026quot;vehicle_identifier\\u0026quot; and it will look for license plates, VINs, and vehicle IDs — not because that specific string was in the training data, but because the model learned to match semantic similarity between span context and label meaning.\\nNested entity detection With flat_ner: false, overlapping spans are allowed. A document containing \\u0026quot;Dr. Jordan Wells, 2901 Connecticut Ave NW, Washington DC 20008\\u0026quot; can simultaneously yield:\\nname: \\u0026ldquo;Jordan Wells\\u0026rdquo; address: \\u0026ldquo;2901 Connecticut Ave NW, Washington DC 20008\\u0026rdquo; city: \\u0026ldquo;Washington\\u0026rdquo; postcode: \\u0026ldquo;20008\\u0026rdquo; All from the same text, none conflicting.\\nNVIDIA GLiNER-PII: the fine-tune NVIDIA fine-tuned the GLiNER base (urchade/gliner_large-v2.1) into a PII-specific model. The result is nvidia/gliner-PII, released October 2025 on HuggingFace and served via NVIDIA NIM since March 2026.\\nArchitecture Base: urchade/gliner_large-v2.1 / knowledgator/gliner-bi-large-v1.0 Architecture type: Transformer, bidirectional encoder Parameters: 570 million (5.7 × 10⁸) Runtime: PyTorch, GLiNER Python library Hardware: NVIDIA Ampere through Blackwell; also runs on CPU (x86_64) Training data: Nemotron-PII Training a PII detection model on real PII is self-defeating — you\\u0026rsquo;d be handling the very data you\\u0026rsquo;re trying to protect. NVIDIA solved this with nvidia/Nemotron-PII: a fully synthetic dataset generated with NVIDIA NeMo Data Designer.\\nSize: ~100,000 records, under 1 billion tokens Method: persona-grounded generation. Personas were derived from US Census demographic distributions, not invented at random. This matters: a model trained on \\u0026quot;John Doe at 123 Main Street\\u0026quot; will miss real-world name distributions. A model trained on realistically diverse names, addresses, and identifiers generalizes to actual documents. Coverage: 50+ industries, 55+ entity types, US and international formats Labeling: automatic — spans were injected at generation time, eliminating human annotator contact with sensitive data Entity categories The 55+ supported types group into six domains:\\nIdentity — name, first_name, last_name, ssn, national_id, tax_id, date_of_birth, age, gender, employee_id, customer_id, certificate_license_number\\nFinancial — account_number, credit_debit_card, cvv, pin, bank_routing_number, swift_bic, iban\\nMedical — medical_record_number, health_plan_beneficiary_number, blood_type, biometric_identifier\\nLocation — address, street_address, city, state, postcode, country, latitude, longitude, coordinate\\nContact — email, phone_number, fax_number, url\\nNetwork / Device — ipv4, ipv6, mac_address, api_key, user_name, password, http_cookie, device_identifier, vehicle_identifier, license_plate\\nDemographic / Other — occupation, company_name, language, education_level, employment_status, political_view, race_ethnicity, religious_belief, sexuality, date, date_time, time, unique_identifier\\nBenchmarks Evaluated at threshold=0.3 (strict F1 — both entity text and label must match exactly):\\nBenchmark V1 V2 (current) Δ Argilla PII 0.64 0.70 +0.06 AI4Privacy 0.60 0.64 +0.04 nvidia/Nemotron-PII 0.66 0.87 +0.21 The three evaluation sets (Argilla, AI4Privacy, Gretel PII V1/V2) use hybrid human+automated labeling — intentionally different from the synthetic training data to test real-world generalization. The +0.21 jump on the NVIDIA dataset between versions reflects both better training coverage and improved label-to-span alignment in V2.\\nEvaluation hardware: NVIDIA A100 (Ampere, PCIe/SXM).\\nThe API NVIDIA NIM exposes GLiNER-PII through an OpenAI-compatible endpoint with additional parameters:\\nimport OpenAI from \\u0026#39;openai\\u0026#39;; const openai = new OpenAI({ apiKey: process.env.NVIDIA_API_KEY, baseURL: \\u0026#39;https://integrate.api.nvidia.com/v1\\u0026#39;, }); const completion = await openai.chat.completions.create({ model: \\u0026#34;nvidia/gliner-pii\\u0026#34;, messages: [{ role: \\u0026#34;user\\u0026#34;, content: \\u0026#34;Dr. Jordan Wells, DOB 04/14/1979, MRN MR-88421. Contact: (202) 555-0193\\u0026#34; }], // GLiNER-specific parameters: labels: [\\u0026#34;name\\u0026#34;, \\u0026#34;date_of_birth\\u0026#34;, \\u0026#34;medical_record_number\\u0026#34;, \\u0026#34;phone_number\\u0026#34;], threshold: 0.5, // 0–1. Lower = more recall, more false positives. Tune per use case. chunk_length: 384, // token window for long documents overlap: 128, // overlap between chunks — prevents entities split at boundaries flat_ner: false, // allow nested spans }); const result = JSON.parse(completion.choices[0].message.content); // result.entities → [{text, label, start, end, score}, ...] // result.tagged_text → original text with entity markers chunk_length and overlap matter for anything beyond a paragraph. A ten-page contract tokenizes to roughly 4,000 tokens. The model processes it as overlapping 384-token windows; the 128-token overlap prevents an entity that straddles a chunk boundary from being missed by both chunks.\\nthreshold is a business-level decision. For HIPAA audit logging you want high recall — set it low (0.3) and accept more false positives for human review. For automated inline redaction you want high precision — raise it to 0.7+ and let borderline cases pass through to a secondary review queue.\\nDemo The recording below shows a Python script calling nvidia/gliner-pii via the NIM API against a banking record with eight PII entities. Entities are printed with confidence scores and a reconstructed tagged-text output.\\nTo run this yourself: get a free NIM API key, install openai (pip install openai), and swap in your key.\\nWhere GLiNER-PII fits — and what it doesn\\u0026rsquo;t replace GLiNER-PII is a detection component. It has no policy engine, no network interception layer, no storage classification system, and no alerting pipeline. What it provides is a reliable answer to: \\u0026ldquo;does this text contain sensitive entities, and where?\\u0026rdquo;\\nPlugged into a pipeline it looks like:\\nDocument ingestion → chunk (384 tokens, 128 overlap) → GLiNER-PII (labels: your required categories, threshold: tuned per use case) → decision: redact / tag / alert / pass → audit log (entity type, offset, document ID, score — not the entity value itself) On threshold tuning: NVIDIA evaluated the model at threshold=0.3. The default in the NIM API is 0.5. Neither is universally correct. For HIPAA audit logging in healthcare, you want to catch everything — set the threshold low and route borderline detections to a human review queue. For automated inline redaction of customer support tickets, you want high precision — a false positive that redacts a legitimate part number frustrates engineers. The model is the same either way; the threshold is an operational parameter.\\nOn running it locally: the GLiNER Python library (pip install gliner) lets you run nvidia/gliner-PII entirely on your own hardware with GLiNER.from_pretrained(\\u0026quot;nvidia/gliner-pii\\u0026quot;). The data never leaves your perimeter. For GDPR or HIPAA contexts this matters more than the latency difference.\\nOn human review: NVIDIA\\u0026rsquo;s own model card states it directly — \\u0026ldquo;performance varies by domain, format, and threshold, so validation and human review are recommended for high-stakes deployments.\\u0026rdquo; A strict F1 of 0.70 on Argilla PII means 30% of entities in that benchmark were either missed or mislabeled. In a medical records context that is not an acceptable autonomous redaction rate; it is, however, an excellent triage signal for a human reviewer to work from.\\nModel card: HuggingFace · NVIDIA NIM · GLiNER paper: arxiv:2311.08526\\n\",\"date\":\"2026-05-30\",\"slug\":\"gliner-pii-data-loss-prevention\",\"summary\":\"Traditional DLP fails on unstructured text. Here's how a 570M-parameter span-scoring transformer handles what regex can't — architecture, fine-tuning, benchmarks, and a live demo.\",\"title\":\"PII detection that actually understands context: NVIDIA GLiNER-PII\"}],\"projects\":[{\"description\":\"LLM that roleplays as a real network device — SSH + RESTCONF interfaces, session state, YANG/CLI grounding via RAG. Ansible playbooks and Terraform providers connect with no changes. ~80% output match vs real hardware.\",\"highlight\":true,\"image\":\"/images/yc-thumb.svg\",\"link\":\"#\",\"tech\":\"Python,LangChain,Neo4j,FastAPI,RAG,BM25,HuggingFace\",\"title\":\"AI-Powered Network Sandbox Platform\"},{\"description\":\"Isolated execution environment for LLM agents. Each run spins up a fresh Docker container with gVisor (runsc) kernel-level isolation, captures stdout/stderr, and tears down. Exposed as a Sandbox for
