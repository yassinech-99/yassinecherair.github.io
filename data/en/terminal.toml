# Interactive harness — welcome, commands, token budget

[welcome]
window_title = "portfolio — v0.1"
lines = [
  "type slash commands to explore.",
  "Web articles live at /blog/ · read in-terminal with /blog.",
  "Session budget in the footer · type /usage for details.",
]

[boot_hints]
lines = [
  "/whoami  /experience  /skills  /projects  /blog  /hireme",
  "/usage  /clear  /help",
]

[budget]
total_tokens = 50000
base_cost = 400
chars_per_token = 2
clear_cost = 50
usage_cost = 80
dzd_per_1k_tokens = 10
currency = "DZD"

[[commands]]
name = "help"
description = "List all slash commands"

[[commands]]
name = "whoami"
description = "About Yassine"

[[commands]]
name = "experience"
description = "Work history"

[[commands]]
name = "skills"
description = "Tech stack"

[[commands]]
name = "projects"
description = "Selected projects"

[[commands]]
name = "blog"
description = "Browse and read posts in-terminal"

[[commands]]
name = "hireme"
description = "Contact & links"

[[commands]]
name = "usage"
description = "Token budget & session stats"

[[commands]]
name = "clear"
description = "Clear terminal scrollback"

[[exhausted.lines]]
type = "warn"
text = "billing error: quota exceeded"

[[exhausted.lines]]
type = "agent"
text = "yassine has an unpaid bill. harness suspended until finance approves."

[[exhausted.lines]]
type = "dim"
text = "refresh the page to reset your free tier. or try /hireme to negotiate."

[[exhausted.lines]]
type = "success"
text = "(this is a joke — you're on the static site free tier)"
