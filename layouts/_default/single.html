{{ define "main" }}
<article class="py-8 pi-content-wide">
    {{ if eq .Section "blog" }}
    <a href="{{ "blog/" | relURL }}" class="font-mono text-sm text-pi-muted mb-8 inline-block">← All posts</a>
    {{ end }}

    <header class="mb-10 pb-8 border-b" style="border-color: var(--line)">
        {{ if eq .Section "blog" }}
        <div class="flex flex-wrap gap-2 mb-4">
            {{ range .Params.tags }}
            <span class="pi-chip">{{ . }}</span>
            {{ end }}
        </div>
        {{ end }}

        <h1 class="font-serif text-4xl md:text-5xl font-medium leading-tight text-pi mb-4">{{ .Title }}</h1>

        {{ if .Params.description }}
        <p class="text-lg mb-4" style="color: var(--copy)">{{ .Params.description }}</p>
        {{ end }}

        <time datetime="{{ .Date.Format "2006-01-02" }}" class="font-mono text-xs text-pi-muted block">{{ .Date.Format "January 2, 2006" }}</time>
    </header>

    <div class="pi-prose pi-article-content">
        {{ .Content }}
    </div>
</article>
{{ end }}
